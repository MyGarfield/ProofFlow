[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veriagent-proofflow"
version = "0.1.0a0"
description = "Evidence-native control plane for auditable high-risk multi-agent decisions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "VeriAgent" },
]
dependencies = [
  "cryptography>=46,<47",
  "pydantic>=2.11,<3",
]

[project.scripts]
proofflow = "proofflow.cli:main"

[dependency-groups]
dev = [
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["proofflow", "demo"]
