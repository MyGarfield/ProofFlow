apiVersion: proofflow.dev/v1alpha1
kind: SkillSpecList
metadata:
  name: proofflow-core-skills
  version: 0.1.0-design
  status: DESIGN_ONLY
spec:
  disclaimer: >-
    本清单为 Skill 设计规格。所有 Skill 当前均为 DESIGN_ONLY，
    尚未完成代码实现、AgentTeams 分发、工具联调、版本发布或运行验证。
  commonContract:
    requiredFields:
      - skillId
      - version
      - purpose
      - inputs
      - outputs
      - invocationConditions
      - dependentTools
      - failureHandling
      - securityBoundary
      - reuseValue
      - collaboration
      - validationPlan
    plannedRuntimeFields:
      - idempotency_key
      - trace_id
      - caller_identity
      - permission_scope
      - schema_version
    plannedLifecycle:
      - DRAFT
      - CONTRACT_TESTED
      - RELEASE_CANDIDATE
      - ACTIVE
      - DEPRECATED
      - ROLLED_BACK

  items:
    - skillId: evidence_ingest
      displayName: 证据摄取
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划将原始材料转换为保留来源、哈希、置信度和数据分类的 EvidenceObject。"
      ownerIdentities:
        - PF-A2
      invocationConditions:
        - "案件已创建。"
        - "文件已进入授权对象存储。"
        - "文件类型、大小和安全扫描计划通过。"
      inputs:
        - name: case_id
          type: string
          required: true
        - name: tenant_id
          type: string
          required: true
        - name: source_uri
          type: string
          required: true
        - name: mime_type
          type: string
          required: true
        - name: submitted_by
          type: string
          required: true
        - name: received_at
          type: datetime
          required: true
      outputs:
        - name: evidence_objects
          type: EvidenceObject[]
        - name: source_hash
          type: string
        - name: extraction_report
          type: ExtractionReport
        - name: warnings
          type: Warning[]
      dependentTools:
        - name: object-store
          plannedIntegration: S3_COMPATIBLE_OR_EQUIVALENT
          status: DESIGN_ONLY
        - name: document-parser
          plannedIntegration: HTTP_OR_LOCAL_ADAPTER
          status: DESIGN_ONLY
        - name: ocr
          plannedIntegration: HTTP_OR_LOCAL_ADAPTER
          status: DESIGN_ONLY
        - name: file-security-scanner
          plannedIntegration: HTTP_OR_LOCAL_ADAPTER
          status: DESIGN_ONLY
      failureHandling:
        - code: UNSUPPORTED_FILE
          action: "隔离文件并请求人工处理。"
        - code: MALICIOUS_FILE
          action: "阻断处理并记录安全事件。"
        - code: LOW_CONFIDENCE
          action: "保留提取结果但标记 NEEDS_HUMAN。"
        - code: SOURCE_HASH_MISMATCH
          action: "阻断写入并记录完整性异常。"
      securityBoundary:
        - "只读原始材料，不覆盖或删除原件。"
        - "不得根据模型推断补写原文不存在的事实。"
        - "普通日志仅记录对象引用和脱敏摘要。"
      reuseValue:
        - "理赔材料摄取"
        - "合同审核"
        - "合规调查"
      collaboration:
        caller: PF-A2
        consumers:
          - PF-A2
          - PF-A3
          - PF-A4
          - PF-A5
          - PF-A6
      observabilityPlan:
        traceSpans:
          - parser
          - ocr
          - object-write
        sensitiveDataLogging: REDACT
      validationPlan:
        - "支持格式测试"
        - "低置信转人工测试"
        - "恶意文件隔离测试"
        - "来源哈希一致性测试"

    - skillId: timeline_build
      displayName: 事实时间线构建
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划从证据引用生成带来源的事实事件、时间范围、未决日期和冲突提示。"
      ownerIdentities:
        - PF-A2
      invocationConditions:
        - "相关材料已生成 EvidenceObject。"
        - "每个输入引用属于当前 tenant_id 和 case_id。"
      inputs:
        - name: case_id
          type: string
          required: true
        - name: evidence_refs
          type: string[]
          required: true
        - name: timezone
          type: string
          required: true
        - name: locale
          type: string
          required: false
      outputs:
        - name: events
          type: TimelineEvent[]
        - name: unresolved_items
          type: UnresolvedFact[]
        - name: temporal_conflicts
          type: Conflict[]
      dependentTools:
        - name: evidence-query
          plannedIntegration: INTERNAL_API
          status: DESIGN_ONLY
        - name: temporal-normalizer
          plannedIntegration: LIBRARY_OR_SERVICE
          status: DESIGN_ONLY
      failureHandling:
        - code: AMBIGUOUS_DATE
          action: "保留未知或时间范围，不生成虚构时间点。"
        - code: MISSING_SOURCE_REF
          action: "阻断对应事件写入。"
        - code: CROSS_TENANT_REFERENCE
          action: "拒绝调用并记录权限事件。"
      securityBoundary:
        - "不得修改原始 EvidenceObject。"
        - "每个事件必须包含 source_refs 或标记为未决。"
        - "不得将模型猜测标记为已确认事实。"
      reuseValue:
        - "事故复盘"
        - "理赔调查"
        - "企业合规"
      collaboration:
        caller: PF-A2
        consumers:
          - PF-A3
          - PF-A4
          - PF-A5
          - PF-A6
      observabilityPlan:
        traceSpans:
          - evidence-read
          - event-extraction
          - conflict-check
      validationPlan:
        - "多来源同日事件测试"
        - "模糊日期测试"
        - "矛盾日期测试"
        - "来源引用完整性测试"

    - skillId: rule_retrieve
      displayName: 规则检索
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划按争议焦点、地区和日期检索受控规则，并输出带来源、版本和有效期的 RuleCitation。"
      ownerIdentities:
        - PF-A3
      invocationConditions:
        - "issue_code、jurisdiction 和 as_of_date 已提供。"
        - "调用身份具备规则库读取权限。"
      inputs:
        - name: issue_code
          type: string
          required: true
        - name: jurisdiction
          type: string
          required: true
        - name: as_of_date
          type: date
          required: true
        - name: fact_refs
          type: string[]
          required: false
        - name: top_k
          type: integer
          required: false
      outputs:
        - name: citations
          type: RuleCitation[]
        - name: retrieval_report
          type: RetrievalReport
        - name: insufficiency
          type: InsufficientAuthorityNotice
      dependentTools:
        - name: approved-rule-rag
          plannedIntegration: MCP_PREFERRED_OR_EQUIVALENT_CONTRACT
          status: DESIGN_ONLY
        - name: effective-date-filter
          plannedIntegration: INTERNAL_COMPONENT
          status: DESIGN_ONLY
        - name: source-validator
          plannedIntegration: INTERNAL_COMPONENT
          status: DESIGN_ONLY
      failureHandling:
        - code: MISSING_JURISDICTION
          action: "阻断并请求补充。"
        - code: MISSING_AS_OF_DATE
          action: "阻断并请求补充。"
        - code: INSUFFICIENT_AUTHORITY
          action: "弃答并升级人工检索。"
        - code: RULE_CONFLICT
          action: "保留冲突引用并交 Audit Agent。"
      securityBoundary:
        - "仅访问受控来源白名单。"
        - "上传材料内容不得改变系统检索策略。"
        - "案件私密材料不得进入全局规则索引。"
      reuseValue:
        - "企业合规"
        - "保险理赔"
        - "合同审核"
      collaboration:
        caller: PF-A3
        consumers:
          - PF-A4
          - PF-A5
          - PF-A6
      observabilityPlan:
        traceSpans:
          - query-normalization
          - retrieval
          - rerank
          - source-validation
      validationPlan:
        - "地区过滤测试"
        - "生效和失效日期测试"
        - "无权威来源弃答测试"
        - "来源引用哈希测试"

    - skillId: deterministic_calculate
      displayName: 确定性计算
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划通过显式公式和版本化参数生成可复现的分项计算表。"
      ownerIdentities:
        - PF-A4
      invocationConditions:
        - "关键事实引用已确认。"
        - "无阻断级事实冲突。"
        - "formula_version 已指定。"
      inputs:
        - name: verified_fact_refs
          type: string[]
          required: true
        - name: rule_refs
          type: string[]
          required: true
        - name: parameters
          type: CalculationParameterSet
          required: true
        - name: formula_version
          type: string
          required: true
      outputs:
        - name: line_items
          type: CalculationLineItem[]
        - name: total
          type: decimal
        - name: missing_parameters
          type: string[]
        - name: formula_refs
          type: string[]
        - name: reproducibility_hash
          type: string
      dependentTools:
        - name: formula-engine
          plannedIntegration: INTERNAL_HTTP_OR_LIBRARY
          status: DESIGN_ONLY
        - name: formula-registry
          plannedIntegration: VERSIONED_CONFIG
          status: DESIGN_ONLY
      failureHandling:
        - code: MISSING_PARAMETER
          action: "阻断并返回缺失参数，不输出确定总额。"
        - code: INVALID_PARAMETER
          action: "阻断并请求人工核验。"
        - code: FORMULA_NOT_FOUND
          action: "阻断并记录配置错误。"
        - code: VERSION_MISMATCH
          action: "拒绝计算并要求显式选择版本。"
      securityBoundary:
        - "不得使用 LLM 心算替代公式引擎。"
        - "不得猜测缺失参数。"
        - "不得修改事实或规则引用。"
      reuseValue:
        - "劳动补偿计算"
        - "薪酬计算"
        - "理赔金额计算"
      collaboration:
        caller: PF-A4
        consumers:
          - PF-A5
          - PF-A6
      observabilityPlan:
        traceSpans:
          - parameter-validation
          - formula-resolution
          - calculation
          - result-hash
      validationPlan:
        - "公式单元测试"
        - "相同输入重复运行一致性测试"
        - "缺参阻断测试"
        - "公式版本回滚测试"

    - skillId: conflict_detect
      displayName: 冲突检测
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划检测证据、事实、规则和计算之间的冲突，并生成带引用和严重度的 ConflictReport。"
      ownerIdentities:
        - PF-A6
      invocationConditions:
        - "新 Evidence、RuleCitation、Calculation 或 Proposal 写入后。"
        - "请求 decision_audit 前。"
      inputs:
        - name: evidence_refs
          type: string[]
          required: false
        - name: claim_refs
          type: string[]
          required: false
        - name: rule_refs
          type: string[]
          required: false
        - name: calculation_refs
          type: string[]
          required: false
        - name: policy_version
          type: string
          required: true
      outputs:
        - name: conflicts
          type: Conflict[]
        - name: blockers
          type: Conflict[]
        - name: coverage_report
          type: CoverageReport
      dependentTools:
        - name: evidence-graph-query
          plannedIntegration: INTERNAL_API
          status: DESIGN_ONLY
        - name: schema-validator
          plannedIntegration: LIBRARY_OR_SERVICE
          status: DESIGN_ONLY
      failureHandling:
        - code: INCOMPLETE_INPUT
          action: "返回 INCOMPLETE，不将未发现冲突解释为无冲突。"
        - code: POLICY_NOT_FOUND
          action: "阻断审计链。"
        - code: GRAPH_QUERY_FAILED
          action: "有界重试后升级人工。"
      securityBoundary:
        - "仅标记冲突，不修改源对象。"
        - "不得自动选择任一冲突事实为真。"
      reuseValue:
        - "多材料审核"
        - "合规调查"
        - "理赔核验"
      collaboration:
        caller: PF-A6
        consumers:
          - PF-A6
          - PF-A1
          - Human Reviewer
      observabilityPlan:
        traceSpans:
          - graph-query
          - policy-evaluation
          - conflict-classification
      validationPlan:
        - "证据矛盾测试"
        - "规则冲突测试"
        - "计算与事实不一致测试"
        - "输入不完整测试"

    - skillId: decision_audit
      displayName: 决策审计
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划检查候选方案的依据、冲突、权限和 Trace，并输出 PASS、REVISE 或 BLOCK。"
      ownerIdentities:
        - PF-A6
      invocationConditions:
        - "至少一个 Proposal 已生成。"
        - "ConflictReport 已生成。"
        - "上游关键引用和 Trace 摘要可用。"
      inputs:
        - name: proposal_refs
          type: string[]
          required: true
        - name: evidence_refs
          type: string[]
          required: true
        - name: rule_refs
          type: string[]
          required: true
        - name: calculation_refs
          type: string[]
          required: true
        - name: conflict_report_ref
          type: string
          required: true
        - name: trace_summary
          type: TraceSummary
          required: true
        - name: audit_policy_version
          type: string
          required: true
      outputs:
        - name: verdict
          type: enum
          allowed:
            - PASS
            - REVISE
            - BLOCK
        - name: findings
          type: AuditFinding[]
        - name: unsupported_claims
          type: UnsupportedClaim[]
        - name: required_actions
          type: RequiredAction[]
        - name: audit_hash
          type: string
      dependentTools:
        - name: audit-policy-engine
          plannedIntegration: INTERNAL_COMPONENT
          status: DESIGN_ONLY
        - name: trace-store
          plannedIntegration: OTEL_OR_EQUIVALENT
          status: DESIGN_ONLY
      failureHandling:
        - code: TRACE_INCOMPLETE
          action: "输出 BLOCK。"
        - code: CRITICAL_CONFLICT
          action: "输出 BLOCK。"
        - code: UNSUPPORTED_CLAIM
          action: "输出 REVISE 或 BLOCK。"
        - code: POLICY_NOT_FOUND
          action: "阻断并记录配置异常。"
      securityBoundary:
        - "不得修改被审计对象。"
        - "不得生成 ApprovalRecord。"
        - "不得在 Trace 缺失时输出 PASS。"
      reuseValue:
        - "高风险决策审计"
        - "理赔审计"
        - "企业合规审计"
      collaboration:
        caller: PF-A6
        consumers:
          - PF-A1
          - Human Reviewer
          - Human Approver
      observabilityPlan:
        traceSpans:
          - trace-check
          - evidence-coverage
          - permission-check
          - verdict
      validationPlan:
        - "Trace 缺失阻断测试"
        - "无依据陈述测试"
        - "关键冲突阻断测试"
        - "Audit Agent 自审批禁止测试"

    - skillId: human_approval
      displayName: 人工审批
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划将人工批准、拒绝或退回与特定方案和审计对象哈希绑定。"
      ownerIdentities:
        - PF-A1
      humanExecutorRequired: true
      invocationConditions:
        - "AuditReport 允许进入审批。"
        - "审批对象和摘要已生成哈希。"
        - "请求指定 required_role 和 expires_at。"
      inputs:
        - name: approval_request_id
          type: string
          required: true
        - name: case_id
          type: string
          required: true
        - name: proposal_ref
          type: string
          required: true
        - name: approved_artifact_hash
          type: string
          required: true
        - name: evidence_digest
          type: string
          required: true
        - name: rule_digest
          type: string
          required: true
        - name: calculation_digest
          type: string
          required: true
        - name: audit_report_ref
          type: string
          required: true
        - name: required_role
          type: string
          required: true
        - name: expires_at
          type: datetime
          required: true
      outputs:
        - name: decision
          type: enum
          allowed:
            - APPROVE
            - REJECT
            - REVISE
        - name: approver_id
          type: string
        - name: reason
          type: string
        - name: signed_at
          type: datetime
        - name: signature_or_hash
          type: string
        - name: supersedes
          type: string
      dependentTools:
        - name: agentteams-human-or-approval-ui
          plannedIntegration: MATRIX_OR_EQUIVALENT_UI
          status: DESIGN_ONLY
        - name: rbac
          plannedIntegration: AGENTTEAMS_HUMAN_OR_INTERNAL
          status: DESIGN_ONLY
        - name: append-only-audit-log
          plannedIntegration: INTERNAL_SERVICE
          status: DESIGN_ONLY
      failureHandling:
        - code: UNAUTHORIZED_APPROVER
          action: "拒绝审批并记录安全事件。"
        - code: APPROVAL_EXPIRED
          action: "审批无效，要求重新发起。"
        - code: ARTIFACT_CHANGED
          action: "旧审批自动失效。"
        - code: AUDIT_NOT_PASSABLE
          action: "不允许进入批准状态。"
      securityBoundary:
        - "不得默认批准或由 Agent 模拟人工批准。"
        - "批准仅对指定哈希和范围有效。"
        - "审批后任何相关产物变化均计划触发重新审批。"
      reuseValue:
        - "所有具有外部副作用的业务流程"
      collaboration:
        requester: PF-A1
        executor: Human Approver
        consumers:
          - PF-A1
          - document_package
      observabilityPlan:
        traceSpans:
          - approval-request
          - role-check
          - artifact-hash-check
          - human-decision
      validationPlan:
        - "越权审批测试"
        - "审批超时测试"
        - "审批后产物变化测试"
        - "Agent 模拟批准禁止测试"

    - skillId: document_package
      displayName: 交付包生成
      version: 0.1.0-design
      status: DESIGN_ONLY
      implementationStatus: NOT_IMPLEMENTED
      purpose: "计划在有效人工审批后生成受控草案、附件清单、文件哈希和 PackageManifest。"
      ownerIdentities:
        - PF-A1
      invocationConditions:
        - "ApprovalRecord 有效。"
        - "审批对象哈希未变化。"
        - "无新增阻断级审计发现。"
      inputs:
        - name: approval_id
          type: string
          required: true
        - name: approved_artifact_hash
          type: string
          required: true
        - name: template_id
          type: string
          required: true
        - name: template_version
          type: string
          required: true
        - name: output_format
          type: string
          required: true
        - name: destination_policy
          type: string
          required: true
          plannedDefault: CONTROLLED_DRAFT_ONLY
      outputs:
        - name: package_id
          type: string
        - name: files
          type: GeneratedFile[]
        - name: manifest
          type: PackageManifest
        - name: file_hashes
          type: string[]
        - name: validation_report
          type: PackageValidationReport
      dependentTools:
        - name: template-engine
          plannedIntegration: INTERNAL_COMPONENT
          status: DESIGN_ONLY
        - name: document-renderer
          plannedIntegration: HTTP_OR_LOCAL_ADAPTER
          status: DESIGN_ONLY
        - name: controlled-object-store
          plannedIntegration: S3_COMPATIBLE_OR_EQUIVALENT
          status: DESIGN_ONLY
      failureHandling:
        - code: APPROVAL_NOT_FOUND
          action: "阻断生成。"
        - code: APPROVAL_INVALID
          action: "阻断生成并要求重新审批。"
        - code: ARTIFACT_HASH_MISMATCH
          action: "阻断生成并记录完整性异常。"
        - code: RENDER_FAILED
          action: "不发布半成品，保留失败日志。"
      securityBoundary:
        - "默认只生成受控草案。"
        - "不得自动发送、签署、提交或写入外部系统。"
        - "输出文件必须记录模板版本和内容哈希。"
      reuseValue:
        - "法律材料草案"
        - "理赔报告"
        - "合规报告"
        - "企业交付材料"
      collaboration:
        caller: PF-A1
        prerequisites:
          - decision_audit
          - human_approval
        consumers:
          - Human Reviewer
          - Authorized Delivery Operator
      observabilityPlan:
        traceSpans:
          - approval-validation
          - template-resolution
          - rendering
          - manifest-generation
      validationPlan:
        - "无审批阻断测试"
        - "审批对象变化测试"
        - "模板版本测试"
        - "渲染失败不发布测试"
