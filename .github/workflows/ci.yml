name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/export_schemas.py --check
      - name: Validate historical supply-chain snapshot consistency
        run: uv run python deploy/tool-service/scripts/validate_supply_chain_evidence.py --mode consistency
      - run: uv run python deploy/agentteams/scripts/validate_public_evidence.py --strict deploy/agentteams/evidence/local-infra-smoke-2026-08-20.json
      - run: uv run python deploy/agentteams/scripts/validate_mcp_smoke_evidence.py --strict deploy/agentteams/evidence/mcp-manager-operator-smoke-2026-08-20.json
      - name: Validate pinned Aliyun official Skill offline evidence
        run: uv run python deploy/agentteams/scripts/validate_aliyun_official_skill_evidence.py deploy/agentteams/evidence/aliyun-official-skill-offline-preflight-2026-08-21.json
      - run: node --check demo/app.js
      - run: node --test tests/js/test_demo_view_state.cjs
      - run: uv run python scripts/validate_public_demo_landing.py
      - run: node --check public-demo/app.js
      - run: node --check scripts/qa_public_demo_browser.mjs
      - run: node --test tests/js/test_public_demo_storyboard.cjs
      - run: uv run pytest

  installable-distribution-matrix:
    name: Installable distribution (${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            dependencies: minimum
            cryptography-version: "46.0.0"
            pydantic-version: "2.11.0"
          - python-version: "3.14"
            dependencies: maximum
            cryptography-version: "46.0.7"
            pydantic-version: "2.13.4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Build and run wheel/sdist outside the source checkout
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/tests/release/constraints/${{ matrix.dependencies }}.txt
          PROOFFLOW_EXPECT_CRYPTOGRAPHY: ${{ matrix.cryptography-version }}
          PROOFFLOW_EXPECT_PYDANTIC: ${{ matrix.pydantic-version }}
        run: uv run pytest tests/e2e/test_installable_distribution.py
