name: Bug report
description: Report a reproducible defect using synthetic or legally shareable data.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal information, real cases, customer material, or exploit details.
  - type: input
    id: commit
    attributes:
      label: Git commit
      description: Full 40-character SHA where the defect reproduces.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Provide exact commands and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and stable error code
    validations:
      required: true
  - type: dropdown
    id: side_effect
    attributes:
      label: External side effect observed?
      options:
        - "No"
        - "Unknown"
        - "Yes — stop and use private vulnerability reporting"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal information, real cases, customer material, and workstation paths.
          required: true
        - label: This public report contains no external-effect incident, tenant breach, approval bypass, or exploit detail; those go to private vulnerability reporting.
          required: true
